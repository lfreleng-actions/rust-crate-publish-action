# rust-crate-publish-action
name: "🦀 Rust Crate Publish"
# yamllint disable-line rule:line-length
description: "Packages a Rust crate, checks its size and version, and publishes it to crates.io or another Cargo registry"
# Stages: read metadata, verify the release tag, 'cargo package', check
# the .crate size, 'cargo publish --dry-run', confirm the archive is
# unchanged, then upload. For isolation from crate code, verify in an
# unprivileged dry_run job and upload from a credentialed job given
# expected_sha256, which compiles nothing.
# The calling workflow owns authentication, typically crates.io
# Trusted Publishing via rust-lang/crates-io-auth-action. A named
# 'registry' takes its sparse index URL from the caller's
# CARGO_REGISTRIES_<NAME>_INDEX.

inputs:
  # Optional
  path_prefix:
    # yamllint disable-line rule:line-length
    description: "Directory holding the crate or workspace, inside the workspace"
    required: false
    default: "."
  manifest_path:
    # yamllint disable-line rule:line-length
    description: "Path to the crate's Cargo.toml, or with workspace/packages any workspace manifest, relative to path_prefix"
    required: false
    default: "Cargo.toml"
  workspace:
    # yamllint disable-line rule:line-length
    description: "Publish every workspace member the target registry accepts, in dependency order ('true'/'false')"
    required: false
    default: "false"
  packages:
    # yamllint disable-line rule:line-length
    description: "Whitespace-separated workspace members to publish, in dependency order; replaces workspace"
    required: false
    default: ""
  exclude:
    # yamllint disable-line rule:line-length
    description: "Whitespace-separated members to leave out; needs workspace 'true'"
    required: false
    default: ""
  release_tag:
    # yamllint disable-line rule:line-length
    description: "Release tag that every selected crate's version must match, one leading 'v' ignored; empty skips the check"
    required: false
    default: ""
  max_crate_size_bytes:
    # yamllint disable-line rule:line-length
    description: "Largest allowed packaged .crate size in bytes (crates.io cap: 10MB)"
    required: false
    default: "10485760"
  dry_run:
    # yamllint disable-line rule:line-length
    description: "Check and package without publishing ('true'/'false'); needs no credentials"
    required: false
    default: "false"
  registry:
    # yamllint disable-line rule:line-length
    description: "Cargo registry name to publish to; empty (or 'crates-io') means crates.io. Needs CARGO_REGISTRIES_<NAME>_INDEX"
    required: false
    default: ""
  registry_token:
    # yamllint disable-line rule:line-length
    description: "Registry token for the upload alone; empty uses the caller's Cargo credentials"
    required: false
    default: ""
  expected_sha256:
    # yamllint disable-line rule:line-length
    description: "crate_sha256 from an earlier dry_run job (a JSON object for two or more crates); skips compilation and uploads only those archives"
    required: false
    default: ""
  permit_fail:
    description: "Report success even when a stage fails ('true'/'false')"
    required: false
    default: "false"
  summary:
    description: "Write a crate table to the job summary ('true'/'false')"
    required: false
    default: "true"

outputs:
  crate_name:
    # yamllint disable-line rule:line-length
    description: "Crate name, read from its Cargo.toml; several crates: their names in publish order, space-separated"
    value: ${{ steps.publish.outputs.crate_name }}
  crate_version:
    # yamllint disable-line rule:line-length
    description: "Crate version, read from its Cargo.toml; several crates: a JSON object of name to version"
    value: ${{ steps.publish.outputs.crate_version }}
  crate_size_bytes:
    # yamllint disable-line rule:line-length
    description: "Packaged .crate file size in bytes; several crates: a JSON object of name to size"
    value: ${{ steps.publish.outputs.crate_size_bytes }}
  crate_sha256:
    # yamllint disable-line rule:line-length
    description: "SHA-256 of the verified .crate, as the index records it; several crates: a JSON object of name to digest"
    value: ${{ steps.publish.outputs.crate_sha256 }}
  cargo_version:
    description: "Cargo version that packaged the crate"
    value: ${{ steps.publish.outputs.cargo_version }}
  registry_status:
    # yamllint disable-line rule:line-length
    description: "This version on the target registry: 'absent', 'identical' (same archive) or 'different'; several crates: a JSON object"
    value: ${{ steps.publish.outputs.registry_status }}
  publish_status:
    # yamllint disable-line rule:line-length
    description: "Outcome: 'published' (any crate uploaded), 'skipped' (all identical already there), 'dry-run' or 'failed'"
    value: ${{ steps.publish.outputs.publish_status }}
  published:
    # yamllint disable-line rule:line-length
    description: "'true' when this run uploaded a crate, even before a later failure; 'false' for a skip too"
    value: ${{ steps.publish.outputs.published }}

runs:
  using: "composite"
  steps:
    - name: "Check, package and publish crate"
      id: publish
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        INPUT_MAX_CRATE_SIZE_BYTES: ${{ inputs.max_crate_size_bytes }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_REGISTRY_TOKEN: ${{ inputs.registry_token }}
        INPUT_EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        INPUT_PERMIT_FAIL: ${{ inputs.permit_fail }}
        INPUT_SUMMARY: ${{ inputs.summary }}
      run: bash "$ACTION_PATH/scripts/publish-crate.sh"
