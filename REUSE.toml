version = 1

# JSON admits no comment syntax, so this fixture carries its copyright
# and licence information here rather than in a header. It derives from
# the Overture Maps original, as the other test files do.
[[annotations]]
path = ["tests/fixtures/manifest.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "2026 Overture Maps",
  "2026 The Linux Foundation",
]
SPDX-License-Identifier = "MIT"

# The version-stamp test vectors are shared, byte for byte, with
# lfreleng-actions/rust-build-action, so they carry no header.
[[annotations]]
path = [
  "tests/fixtures/version-stamp/**",
  "tests/fixtures/version-stamp-crlf/**",
  "tests/fixtures/version-stamp-inline/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Linux Foundation"
SPDX-License-Identifier = "Apache-2.0"
